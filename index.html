<!doctype html>
<html lang="en" data-values="tab">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vital-Link Dashboard</title>
  </head>
  <body>
    <div class="shell">
      <main class="dash">
        <section class="stage" aria-label="Health views">
          <div class="view-host" id="view-host"></div>
        </section>

        <aside class="tasks" aria-labelledby="tasks-title">
          <header>
            <h1 id="tasks-title" class="sec-head">Tasks</h1>
          </header>
          <ul id="task-list"></ul>
        </aside>
      </main>

      <!-- Status bar below the frame: view switcher, station clock, open tasks. -->
      <footer class="statusbar">
        <div class="views">
          <div class="view-switch">
            <button id="prev" type="button" aria-label="Previous view"><i data-lucide="chevron-left"></i></button>
            <span class="view-now" id="view-now" aria-live="polite"></span>
            <button id="next" type="button" aria-label="Next view"><i data-lucide="chevron-right"></i></button>
          </div>
        </div>
        <div class="clock" aria-label="Station time">
          <span class="clock-time"><span id="gmt"></span><span class="clock-sec" id="gmt-s"></span></span>
          <span class="clock-sub">
            <span>GMT</span>
            <span id="met" title="Mission elapsed time"></span>
          </span>
        </div>
        <div class="status-right">
          <nav class="page-links" aria-label="Pages">
            <a href="/displays.html" target="_top">Display Kit</a>
            <a href="/story.html" target="_top">Story</a>
            <a href="https://github.com/tortooga2/2026_nasa_space_app_hackathon" target="_blank" rel="noopener">GitHub ↗</a>
          </nav>
          <button id="debug-toggle" class="debug-toggle" type="button" aria-pressed="false" title="Debug (` key)">Debug</button>
          <div class="open-count"><span>Open tasks</span><b id="task-count"></b></div>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/dashboard/main.js"></script>
  </body>
</html>
